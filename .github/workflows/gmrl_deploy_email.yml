name: Deploy Email to IIS

on:
  workflow_dispatch:
  push:
    branches: [ dev, main ]
    paths:
      - 'Application.Email/**'

jobs:
  build:
    runs-on: spinsrv3

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Application.Email/package-lock.json

    - name: Install dependencies
      working-directory: Application.Email
      run: npm ci

    - name: Build Next.js app
      working-directory: Application.Email
      run: npm run build

  deploy:
    runs-on: spinsrv3

    environment: ${{ github.ref_name == 'dev' && 'test' || 'prod' }}

    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Application.Email/package-lock.json

    - name: Install dependencies
      working-directory: Application.Email
      run: npm ci

    - name: Build Next.js app
      working-directory: Application.Email
      run: npm run build

    - name: Deploy
      shell: cmd
      env:
        EMAIL_IIS_PATH: ${{ secrets.EMAIL_IIS_PATH }}
      run: |
        rem Copy only. The service is not stopped or restarted here, so the
        rem running process keeps serving the previous build until it is
        rem restarted by hand.
        rem `shell: cmd` only surfaces the LAST command's exit code, so each
        rem copy gets an explicit `|| exit /b 1`.
        xcopy /s /y /i /q .\Application.Email\.next\* "%EMAIL_IIS_PATH%\.next\" || exit /b 1
        copy /y .\Application.Email\package.json "%EMAIL_IIS_PATH%\" || exit /b 1
        copy /y .\Application.Email\package-lock.json "%EMAIL_IIS_PATH%\" || exit /b 1
