name: Deploy Email to IIS

on:
  workflow_dispatch:
  push:
    branches: [ dev, main ]
    paths:
      - 'Application.Email/**'

jobs:
  build:
    runs-on: spinsrv3

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Application.Email/package-lock.json

    - name: Install dependencies
      working-directory: Application.Email
      run: npm ci

    - name: Build Next.js app
      working-directory: Application.Email
      run: npm run build

  deploy:
    runs-on: spinsrv3

    environment: ${{ github.ref_name == 'dev' && 'test' || 'prod' }}

    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Application.Email/package-lock.json

    - name: Install dependencies
      working-directory: Application.Email
      run: npm ci

    - name: Build Next.js app
      working-directory: Application.Email
      run: npm run build

    - name: Deploy
      shell: cmd
      env:
        EMAIL_IIS_PATH: ${{ secrets.EMAIL_IIS_PATH }}
      run: |
        net stop backend_email
        echo node_modules > %TEMP%\xcopy_exclude.txt
        xcopy /s /y /exclude:%TEMP%\xcopy_exclude.txt .\Application.Email\* ${{ secrets.EMAIL_IIS_PATH }}\
        cd ${{ secrets.EMAIL_IIS_PATH }} && npm ci --omit=dev
        net start backend_email

